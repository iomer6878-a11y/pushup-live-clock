<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Push-up LIVE Clock</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif;color:white}.timer{display:flex;justify-content:center;align-items:flex-start;gap:11px;padding:18px 8px;text-shadow:0 2px 8px rgba(0,0,0,.55)}.unit{display:flex;flex-direction:column;align-items:center;min-width:100px}.number{font-weight:800;font-size:clamp(48px,8vw,95px);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:1px}.label{font-weight:800;font-size:clamp(11px,1.35vw,17px);letter-spacing:1.6px;margin-top:13px}.colon{font-size:clamp(48px,8vw,95px);font-weight:800;line-height:1.1}</style></head><body><div class="timer"><div class="unit"><div id="hours" class="number">00</div><div class="label">HOURS</div></div><div class="colon">:</div><div class="unit"><div id="minutes" class="number">00</div><div class="label">MINUTES</div></div><div class="colon">:</div><div class="unit"><div id="seconds" class="number">00</div><div class="label">SECONDS</div></div></div><script>const started=Date.now();function update(){let s=Math.floor((Date.now()-started)/1000);document.getElementById('hours').textContent=String(Math.floor(s/3600)).padStart(2,'0');document.getElementById('minutes').textContent=String(Math.floor(s%3600/60)).padStart(2,'0');document.getElementById('seconds').textContent=String(s%60).padStart(2,'0')}setInterval(update,200);update();</script></body></html>
